[project]
name = "Banking-77-Router"
version = "0.1.0"
description = "Banking77 router project covering TF-IDF ML Classic to modern NN Bert"
readme = "README.md"
authors = [
    { name = "RikiSTM", email = "43899040+RikiSTM@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "fastapi>=0.162.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
secure-banking-rag-gateway = "secure_banking_rag_gateway:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "jupyter>=1.1.1",
]
